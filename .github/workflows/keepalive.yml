name: Supabase keep-alive

# Keeps the jb-dash Supabase project active so the free tier does not auto-pause
# after 7 days of inactivity. Runs on GitHub's servers (which can reach Supabase)
# every Monday and Thursday, plus a manual "Run workflow" button.
#
# SB_KEY below is the PUBLISHABLE key that already ships in the public app
# (index.html), so it is safe to keep here. Rotate it in both places if ever needed.

on:
  schedule:
    - cron: '17 8 * * 1,4'   # 08:17 UTC, Mondays and Thursdays (max gap ~4 days)
  workflow_dispatch:          # allow running on demand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SB_URL: https://ypekahkqbnccbrccaqfe.supabase.co
          SB_KEY: sb_publishable_IE9lkBK6Q282q-5mlVwnBA_2G6rxqck
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SB_URL/rest/v1/jb_settings?select=id&limit=1" \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY")
          echo "Supabase responded with HTTP $code"
          if [ "$code" != "200" ]; then
            echo "Expected 200. Keep-alive query may not have counted as activity."
            exit 1
          fi
          echo "Keep-alive successful. Project activity refreshed."
